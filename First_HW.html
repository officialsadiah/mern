<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <form> 
<input type="text" placeholder="Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<input type="url" placeholder="website">

<input type="file">
<input type="date">
<input type="week">
<input type="month">
<input type="number">
<input type="color">
<input type="range">

<br>

<h3>Gender:</h3>
<label for="male">
<input id="male" name="gender" type="radio"> Male
</label>

<label for="female">
<input id="female" name="gender" type="radio"> Female
</label>

<label for="custome">
<input id="custome" name="gender" type="radio"> Custome
</label>
<br>
<br>

<h3>Results:</h3>
<label for="ssc">
<input id="ssc"  type="checkbox"> SSC
</label>

<label for="hsc">
<input id="hsc"  type="checkbox"> HSC
</label>

<label for="bsc">
<input id="bsc"  type="checkbox"> BSC
</label>


<br>
<br>

<button type="submit">Submit</button>
<button type="reset">Reset</button>

    </form>
</body>
</html>
