<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Date</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .date-card {
            background: white;
            width: 350px;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .date-card h1 {
            margin-bottom: 10px;
            color: #1e293b;
        }

        .day {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
        }

        .date {
            font-size: 20px;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="date-card">
        <h1>Today</h1>

        <div class="day" id="day"></div>

        <div class="date" id="date"></div>
    </div>

    <script src="script36.js"></script>

</body>

</html>
